<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แหล่งเรียนรู้ทั้งหมด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{--primary:#2563eb;--primary-dark:#1d4ed8;--surface:#fff;--bg:#f5f7fb;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--shadow:0 14px 34px rgba(15,23,42,.10)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans Thai",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}
    .learning-page{min-height:100vh;padding:48px 0 80px;background:radial-gradient(circle at top left,rgba(37,99,235,.08),transparent 26%),var(--bg)}
    .learning-container{width:min(1320px,calc(100% - 40px));margin:0 auto}
    .learning-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:30px}
    .learning-kicker{display:inline-flex;align-items:center;gap:8px;margin-bottom:7px;color:#ef7c00;font-size:14px;font-weight:800}
    .learning-heading h1{margin:0;font-size:clamp(30px,4vw,46px);line-height:1.2;color:#172033}.learning-heading p{margin:10px 0 0;color:var(--muted);font-size:16px}
    .learning-back-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;padding:11px 18px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#334155;text-decoration:none;font-weight:700;box-shadow:0 5px 16px rgba(15,23,42,.07);transition:.2s}.learning-back-btn:hover{transform:translateY(-2px);color:var(--primary);border-color:var(--primary)}
    .learning-filter{display:grid;grid-template-columns:minmax(240px,2fr) minmax(180px,1fr) minmax(180px,1fr) auto;gap:12px;align-items:end;margin-bottom:28px;padding:18px;border:1px solid var(--border);border-radius:20px;background:#fff;box-shadow:var(--shadow)}
    .field{display:flex;flex-direction:column;gap:7px}.field label{color:#475569;font-size:13px;font-weight:700}.control{width:100%;min-height:46px;padding:10px 13px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text);outline:none}.control:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(37,99,235,.11)}
    .clear-btn{min-height:46px;padding:10px 16px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:700}.clear-btn:hover{background:var(--primary-dark)}
    .learning-result-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.learning-result-text{color:#475569;font-size:15px;font-weight:600}
    .learning-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.learning-card{min-width:0;overflow:hidden;border:1px solid rgba(226,232,240,.9);border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.08);transition:transform .23s,box-shadow .23s}.learning-card:hover{transform:translateY(-6px);box-shadow:0 18px 42px rgba(15,23,42,.14)}
    .learning-cover{position:relative;height:220px;overflow:hidden;background:#e2e8f0}.learning-cover img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.learning-card:hover .learning-cover img{transform:scale(1.045)}
    .learning-category{position:absolute;top:13px;left:13px;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 26px);padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.94);color:#172033;font-size:12px;font-weight:800;box-shadow:0 5px 15px rgba(15,23,42,.13)}
    .learning-body{padding:18px}.learning-title{display:-webkit-box;overflow:hidden;margin:0 0 12px;color:#172033;font-size:19px;font-weight:800;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:2}.learning-meta{display:flex;align-items:flex-start;gap:9px;margin:8px 0;color:var(--muted);font-size:14px;line-height:1.5}.learning-meta i{width:16px;margin-top:3px;color:var(--primary);text-align:center;flex-shrink:0}
    .learning-card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.learning-stats{display:flex;align-items:center;gap:10px;color:#64748b;font-size:13px;white-space:nowrap}.detail-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:700}.detail-btn:hover{background:var(--primary-dark)}
    .learning-status{grid-column:1/-1;padding:48px 20px;border:1px dashed #cbd5e1;border-radius:18px;background:#fff;color:#64748b;text-align:center;font-size:16px}
    .learning-modal{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.74)}.learning-modal[hidden]{display:none}.learning-modal-box{position:relative;width:min(920px,100%);max-height:92vh;overflow:auto;border-radius:24px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.32)}
    .modal-close{position:sticky;top:14px;z-index:5;float:right;width:42px;height:42px;margin:14px 14px -56px 0;border:0;border-radius:50%;background:rgba(15,23,42,.78);color:#fff;font-size:19px}.detail-slider{position:relative;overflow:hidden;background:#e2e8f0}.detail-slider-track{display:flex;transition:transform .35s}.detail-slide{min-width:100%;height:390px}.detail-slide img{width:100%;height:100%;object-fit:cover}
    .slider-btn{position:absolute;top:50%;z-index:2;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#172033;transform:translateY(-50%);box-shadow:0 5px 18px rgba(0,0,0,.18)}.slider-prev{left:15px}.slider-next{right:15px}
    .detail-content{padding:26px}.detail-content h2{margin:0 45px 18px 0;font-size:28px;line-height:1.35}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}.info-list{display:grid;gap:11px}.info-row{display:grid;grid-template-columns:135px 1fr;gap:10px;padding-bottom:10px;border-bottom:1px dashed var(--border);line-height:1.55}.info-row b{color:#334155}.detail-description{margin-top:18px;color:#475569;line-height:1.8;white-space:pre-line}.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.detail-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;font-weight:700}.detail-link.secondary{border:1px solid var(--border);background:#fff;color:#334155}
    @media(max-width:1150px){.learning-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:900px){.learning-filter{grid-template-columns:1fr 1fr}.learning-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-grid{grid-template-columns:1fr}}@media(max-width:620px){.learning-page{padding:32px 0 58px}.learning-container{width:min(100% - 24px,1320px)}.learning-top{flex-direction:column}.learning-back-btn{width:100%}.learning-filter{grid-template-columns:1fr}.learning-result-bar{align-items:flex-start;flex-direction:column}.learning-grid{grid-template-columns:1fr}.learning-cover{height:240px}.detail-slide{height:260px}.info-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="learning-page"><div class="learning-container">
    <div class="learning-top"><div class="learning-heading"><div class="learning-kicker"><i class="fa-solid fa-location-dot"></i> LEARNING SOURCES</div><h1>แหล่งเรียนรู้ทั้งหมด</h1><p>ค้นหาและเลือกชมแหล่งเรียนรู้ ภูมิปัญญาท้องถิ่น และพื้นที่แห่งการเรียนรู้</p></div><a class="learning-back-btn" href="index.html"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a></div>
    <section class="learning-filter" aria-label="ค้นหาและกรองข้อมูล">
      <div class="field"><label for="learningSearch">ค้นหาแหล่งเรียนรู้</label><input id="learningSearch" class="control" type="search" placeholder="ค้นหาชื่อ ผู้ดูแล ที่ตั้ง หรือคำอธิบาย"></div>
      <div class="field"><label for="learningCategory">ประเภทแหล่งเรียนรู้</label><select id="learningCategory" class="control"><option value="">ทุกประเภท</option></select></div>
      <div class="field"><label for="learningSort">เรียงลำดับ</label><select id="learningSort" class="control"><option value="name-asc">ชื่อ ก–ฮ</option><option value="name-desc">ชื่อ ฮ–ก</option><option value="views-desc">ยอดเข้าชมมากที่สุด</option><option value="rating-desc">คะแนนสูงที่สุด</option><option value="newest">เพิ่มล่าสุด</option></select></div>
      <button id="learningReset" class="clear-btn" type="button"><i class="fa-solid fa-rotate-left"></i> ล้างตัวกรอง</button>
    </section>
    <div class="learning-result-bar"><div id="learningResultText" class="learning-result-text">กำลังโหลดข้อมูล...</div></div>
    <section id="learningGrid" class="learning-grid"><div class="learning-status"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูลแหล่งเรียนรู้...</div></section>
  </div></main>
  <div id="learningModal" class="learning-modal" hidden><div class="learning-modal-box"><button id="learningModalClose" class="modal-close" type="button" aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button><div id="learningDetail"></div></div></div>
  <script>
  (()=>{'use strict';
    const LEARNING_API_URL='https://script.google.com/macros/s/AKfycbxrisIGnewRP8cqrj_-Imv3KtkrXFu-cdUPHN2bqoYVpyJZaV1_K3U6d9o15uc6NBcJlw/exec?mode=learning';
    const FALLBACK_IMAGE='https://placehold.co/900x600?text=Learning+Source';
    const state={items:[],filtered:[],detailIndex:0,detailImages:[]};
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const num=v=>Number.isFinite(Number(v))?Number(v):0;
    function normalize(row){return{id:String(row.id??'').trim(),name:String(row.name??'').trim(),image_url:String(row.image_url??row.image??'').trim(),image2_url:String(row.image2_url??'').trim(),image3_url:String(row.image3_url??'').trim(),manager:String(row.manager??'').trim(),phone:String(row.phone??'').trim(),address:String(row.address??'').trim(),area:String(row.area??'').trim(),category:String(row.category??'').trim(),description:String(row.description??'').trim(),learn_more_url:String(row.learn_more_url??'').trim(),latitude:String(row.latitude??'').trim(),longitude:String(row.longitude??'').trim(),views:num(row.views),reviewCount:num(row.reviewCount),averageRating:num(row.averageRating),created_at:String(row.created_at??'').trim()}}
    function fillCategories(){const list=[...new Set(state.items.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));$('learningCategory').innerHTML='<option value="">ทุกประเภท</option>'+list.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
    function applyFilters(){const q=$('learningSearch').value.trim().toLowerCase(),cat=$('learningCategory').value,sort=$('learningSort').value;let items=state.items.filter(x=>{const text=[x.name,x.manager,x.phone,x.address,x.area,x.category,x.description].join(' ').toLowerCase();return(!q||text.includes(q))&&(!cat||x.category===cat)});items.sort((a,b)=>sort==='name-desc'?b.name.localeCompare(a.name,'th'):sort==='views-desc'?b.views-a.views||a.name.localeCompare(b.name,'th'):sort==='rating-desc'?b.averageRating-a.averageRating||b.reviewCount-a.reviewCount||a.name.localeCompare(b.name,'th'):sort==='newest'?(Date.parse(b.created_at)||0)-(Date.parse(a.created_at)||0):a.name.localeCompare(b.name,'th'));state.filtered=items;renderCards()}
    function renderCards(){const grid=$('learningGrid');$('learningResultText').textContent=`พบ ${state.filtered.length.toLocaleString('th-TH')} รายการ จากทั้งหมด ${state.items.length.toLocaleString('th-TH')} รายการ`;if(!state.filtered.length){grid.innerHTML='<div class="learning-status"><i class="fa-solid fa-magnifying-glass"></i> ไม่พบข้อมูลที่ตรงกับการค้นหา</div>';return}grid.innerHTML=state.filtered.map(x=>`<article class="learning-card"><div class="learning-cover"><img src="${esc(x.image_url||FALLBACK_IMAGE)}" alt="${esc(x.name||'แหล่งเรียนรู้')}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';"><span class="learning-category"><i class="fa-solid fa-tag"></i>${esc(x.category||'ไม่ระบุประเภท')}</span></div><div class="learning-body"><h2 class="learning-title">${esc(x.name||'ไม่ระบุชื่อ')}</h2><div class="learning-meta"><i class="fa-solid fa-location-dot"></i><span>${esc(x.area||x.address||'ไม่ระบุพื้นที่')}</span></div><div class="learning-meta"><i class="fa-solid fa-user"></i><span>${esc(x.manager||'ไม่ระบุผู้ดูแล')}</span></div><div class="learning-card-footer"><div class="learning-stats"><span><i class="fa-solid fa-eye"></i> ${x.views.toLocaleString('th-TH')}</span><span><i class="fa-solid fa-star" style="color:#f59e0b"></i> ${x.averageRating.toFixed(1)}</span></div><button class="detail-btn" type="button" data-id="${esc(x.id)}">ดูรายละเอียด <i class="fa-solid fa-arrow-right"></i></button></div></div></article>`).join('');grid.querySelectorAll('.detail-btn').forEach(btn=>btn.addEventListener('click',()=>openDetail(btn.dataset.id)))}
    function openDetail(id){const x=state.items.find(i=>i.id===id);if(!x)return;state.detailImages=[x.image_url,x.image2_url,x.image3_url].filter(Boolean);if(!state.detailImages.length)state.detailImages=[FALLBACK_IMAGE];state.detailImages=[...new Set(state.detailImages)];state.detailIndex=0;const coords=x.latitude&&x.longitude?`${x.latitude},${x.longitude}`:'';const mapUrl=coords?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coords)}`:'';$('learningDetail').innerHTML=`<div class="detail-slider"><div id="detailSliderTrack" class="detail-slider-track">${state.detailImages.map((img,i)=>`<div class="detail-slide"><img src="${esc(img)}" alt="${esc(x.name)} รูปที่ ${i+1}" onerror="this.onerror=null;this.src='${FALLBACK_IMAGE}';"></div>`).join('')}</div>${state.detailImages.length>1?'<button id="sliderPrev" class="slider-btn slider-prev" type="button"><i class="fa-solid fa-chevron-left"></i></button><button id="sliderNext" class="slider-btn slider-next" type="button"><i class="fa-solid fa-chevron-right"></i></button>':''}</div><div class="detail-content"><h2>${esc(x.name||'แหล่งเรียนรู้')}</h2><div class="detail-grid"><div><div class="info-list"><div class="info-row"><b>ผู้ดูแล</b><span>${esc(x.manager||'-')}</span></div><div class="info-row"><b>โทรศัพท์</b><span>${esc(x.phone||'-')}</span></div><div class="info-row"><b>พื้นที่</b><span>${esc(x.area||'-')}</span></div><div class="info-row"><b>ประเภท</b><span>${esc(x.category||'-')}</span></div><div class="info-row"><b>ที่ตั้ง</b><span>${esc(x.address||'-')}</span></div></div>${x.description?`<div class="detail-description">${esc(x.description)}</div>`:''}</div><div><div class="info-list"><div class="info-row"><b>ยอดเข้าชม</b><span>${x.views.toLocaleString('th-TH')} ครั้ง</span></div><div class="info-row"><b>คะแนนเฉลี่ย</b><span><i class="fa-solid fa-star" style="color:#f59e0b"></i> ${x.averageRating.toFixed(1)}</span></div><div class="info-row"><b>ความคิดเห็น</b><span>${x.reviewCount.toLocaleString('th-TH')} รายการ</span></div></div><div class="detail-actions">${x.learn_more_url?`<a class="detail-link" href="${esc(x.learn_more_url)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-book-open"></i> ศึกษาเพิ่มเติม</a>`:''}${mapUrl?`<a class="detail-link secondary" href="${esc(mapUrl)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-map-location-dot"></i> เปิดแผนที่</a>`:''}</div></div></div></div>`;$('learningModal').hidden=false;document.body.style.overflow='hidden';$('sliderPrev')?.addEventListener('click',()=>moveSlide(-1));$('sliderNext')?.addEventListener('click',()=>moveSlide(1))}
    function moveSlide(d){if(state.detailImages.length<2)return;state.detailIndex=(state.detailIndex+d+state.detailImages.length)%state.detailImages.length;const t=$('detailSliderTrack');if(t)t.style.transform=`translateX(-${state.detailIndex*100}%)`}
    function closeModal(){$('learningModal').hidden=true;document.body.style.overflow=''}
    function resetFilters(){$('learningSearch').value='';$('learningCategory').value='';$('learningSort').value='name-asc';applyFilters()}
function showLoadError(message) {
  console.error('Learning error:', message);

  $('learningResultText').textContent =
    'ไม่สามารถโหลดข้อมูลได้';

  $('learningGrid').innerHTML = `
    <div class="learning-status">
      <i class="fa-solid fa-circle-exclamation"></i>
      ไม่สามารถโหลดข้อมูลแหล่งเรียนรู้ได้<br>
      ${esc(message || 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ')}
    </div>
  `;
}

function handleLearningData(result) {
  clearTimeout(window.learningLoadTimer);

  if (!result || result.success !== true) {
    showLoadError(
      result && result.message
        ? result.message
        : 'ข้อมูลที่ได้รับไม่ถูกต้อง'
    );
    return;
  }

  state.items = Array.isArray(result.sources)
    ? result.sources
        .map(normalize)
        .filter(item => item.name || item.image_url)
    : [];

  fillCategories();
  applyFilters();

  const script =
    document.getElementById('learningJsonpScript');

  if (script) {
    script.remove();
  }
}

/*
 * ต้องประกาศ callback ไว้บน window
 * เพื่อให้ Apps Script เรียกได้
 */
window.receiveLearningData = handleLearningData;

function load() {
  const oldScript =
    document.getElementById('learningJsonpScript');

  if (oldScript) {
    oldScript.remove();
  }

  clearTimeout(window.learningLoadTimer);

  window.learningLoadTimer = setTimeout(function () {
    showLoadError(
      'หมดเวลารอข้อมูลจาก Google Apps Script'
    );
  }, 30000);

  const script = document.createElement('script');

  script.id = 'learningJsonpScript';
  script.async = true;

  script.src =
    LEARNING_API_URL +
    '&callback=window.receiveLearningData';

  script.onload = function () {
    console.log('โหลดไฟล์ JSONP สำเร็จ');
  };

  script.onerror = function (event) {
    clearTimeout(window.learningLoadTimer);

    console.error(
      'JSONP URL ที่โหลดไม่สำเร็จ:',
      script.src,
      event
    );

    showLoadError(
      'ไม่สามารถเชื่อมต่อ Google Apps Script'
    );

    script.remove();
  };

  document.body.appendChild(script);
}
    $('learningSearch').addEventListener('input',applyFilters);$('learningCategory').addEventListener('change',applyFilters);$('learningSort').addEventListener('change',applyFilters);$('learningReset').addEventListener('click',resetFilters);$('learningModalClose').addEventListener('click',closeModal);$('learningModal').addEventListener('click',e=>{if(e.target===$('learningModal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('DOMContentLoaded',load);
  })();
  </script>
</body>
</html>
